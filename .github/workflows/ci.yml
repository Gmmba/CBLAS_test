name: CBLAS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libopenblas-dev

      - name: Configure CMake
        run: cmake -B build -S test

      - name: Build
        run: cmake --build build --parallel

      - name: Run interface tests (CBLAS Level 2)
        run: ./build/run_tests